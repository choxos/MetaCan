[project]
name = "metacan-research-pipeline"
version = "0.1.0"
description = "Reproducible screening and classifier pipeline for MetaCan"
requires-python = ">=3.12,<3.14"
dependencies = [
  "joblib>=1.4,<2",
  "jsonschema>=4.21,<5",
  "numpy>=2.0,<2.3",
  "pyarrow>=18,<22",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "typer>=0.12,<1",
]

[dependency-groups]
dev = [
  "basedpyright>=1.28,<2",
  "joblib-stubs>=1.5,<2",
  "pyarrow-stubs>=20,<21",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "scikit-learn-stubs>=0.0.3,<1",
  "scipy-stubs>=1.18,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
include = ["ml", "tests"]
exclude = ["ml/__pycache__", "tests/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
