# Certbot may update the vhost around this include. Deployment compares this
# application fragment exactly, so proxy and request-limit changes still require
# an explicit nginx reload without treating Certbot's TLS lines as configuration drift.

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection 'upgrade';
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_cache_bypass $http_upgrade;
proxy_read_timeout 120s;
proxy_connect_timeout 120s;
proxy_send_timeout 120s;

location = /api/v1/cohort/export {
    limit_req zone=metacan_export burst=1 nodelay;
    limit_conn metacan_address 1;
    proxy_pass http://127.0.0.1:3111;
}

location = /api/v1/permalink {
    limit_req zone=metacan_permalink burst=2 nodelay;
    limit_conn metacan_address 2;
    proxy_pass http://127.0.0.1:3111;
}

location ~ ^/api/v1/(works|recent)/[^/]+$ {
    limit_req zone=metacan_detail burst=10 nodelay;
    limit_conn metacan_address 5;
    proxy_pass http://127.0.0.1:3111;
}

location /api/ {
    limit_req zone=metacan_api burst=20 nodelay;
    limit_conn metacan_address 10;
    proxy_pass http://127.0.0.1:3111;
}

location / {
    limit_conn metacan_address 30;
    proxy_pass http://127.0.0.1:3111;
}

# Next.js content hashes make these assets immutable.
location /_next/static {
    proxy_pass http://127.0.0.1:3111;
    proxy_cache_valid 60m;
    add_header Cache-Control "public, immutable, max-age=31536000";
}

location /_next/image {
    proxy_pass http://127.0.0.1:3111;
    proxy_cache_valid 60m;
}

client_max_body_size 10M;
