# Shared zones must be declared in nginx's http context. The standard Debian
# nginx configuration includes this file from /etc/nginx/conf.d.
limit_req_zone $binary_remote_addr zone=metacan_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=metacan_detail:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=metacan_export:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=metacan_permalink:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=metacan_address:10m;

limit_req_status 429;
limit_conn_status 429;
