# MétaCan Production Docker Compose
# For deployment at openscience.xera.ac/metacan

services:
  metacan-app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_BASE_PATH: /metacan
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-v0.1.0}
    container_name: metacan-app
    ports:
      # 3006 on the host: 3000 is the tracker's dev port, 3002 is the tracker in
      # prod. This is a new service, so it takes a new host port.
      - "3006:3000"
    restart: unless-stopped
    environment:
      # Force the in-container port to 3000 to match the "3006:3000" mapping and
      # the healthcheck. Pinning it here means a PORT inherited from a future
      # env_file can't make the standalone server bind some other port inside the
      # container and leave host:3006 -> container:3000 dead.
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_PATH=/metacan
      - NEXT_PUBLIC_SITE_URL=https://openscience.xera.ac/metacan
    networks:
      - openscience-network
    healthcheck:
      # Use 127.0.0.1, not localhost: the image's /etc/hosts maps localhost to
      # ::1 as well, and busybox wget tries IPv6 first, but the standalone
      # server binds IPv4 0.0.0.0 only, so localhost probes get "connection
      # refused" and the container is marked unhealthy despite serving fine.
      #
      # The path carries the basePath: the route is /api/v1/health in the source
      # tree but Next serves it at /metacan/api/v1/health once basePath applies.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/metacan/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  openscience-network:
    external: true
