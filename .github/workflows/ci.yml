name: Research pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: research-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --dev

      - name: Check Python formatting and correctness
        run: >-
          uv run ruff check
          ml/classifier_*.py
          ml/full_frame_classifier.py
          deploy/load_classifier.py
          tests/test_classifier_*.py
          tests/test_full_frame_classifier_cli.py
          tests/test_load_classifier.py

      - name: Check Python types
        run: >-
          uv run basedpyright
          ml/classifier_*.py
          ml/full_frame_classifier.py
          deploy/load_classifier.py

      - name: Test classifier and database contracts
        run: uv run pytest -q

      - uses: r-lib/actions/setup-r@v2

      - name: Install PDF text tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Install R dependencies
        run: make deps-ci

      - name: Check research pipeline contracts
        run: make lint

      - name: Confirm generated findings are current
        run: make findings && git diff --exit-code -- pilot/results/FINDINGS.md pilot/results/findings.json

      - name: Validate machine readable metadata
        run: |
          python -m json.tool codemeta.json >/dev/null
          python -m json.tool ro-crate-metadata.json >/dev/null
          python -m json.tool .zenodo.json >/dev/null
          uvx cffconvert --validate
