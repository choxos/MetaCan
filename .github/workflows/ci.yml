name: Web application CI

on:
  push:
    branches: [webapp]
  pull_request:
    branches: [webapp]

permissions:
  contents: read

concurrency:
  group: webapp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: metacan_ci
          POSTGRES_USER: metacan_ci
          POSTGRES_PASSWORD: metacan_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metacan_ci -d metacan_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://metacan_ci:metacan_ci@127.0.0.1:5432/metacan_ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Verify migration baseline on a fresh database
        run: npm run db:preflight | grep -Fx clean

      - name: Apply migrations
        run: npm run db:migrate

      - name: Verify resolved migration baseline
        run: npm run db:preflight | grep -Fx resolved

      - name: Verify empty frame facet refresh
        run: npm run db:refresh-facets

      - name: Check application code
        run: npm run check

      - name: Validate citation metadata
        run: uvx cffconvert --validate

      - name: Verify French finding translations
        run: node scripts/i18n-findings.mjs && git diff --exit-code -- src/lib/findings-fr.ts

      - name: Check dependency security
        run: npm audit --audit-level=high

      - name: Build production application
        run: npm run build
